<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #fff;
            padding: 16px 24px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 {
            font-size: 18px;
            color: #333;
        }
        .header input {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            width: 120px;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            margin-bottom: 16px;
            display: flex;
        }
        .message.user {
            justify-content: flex-end;
        }
        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.5;
        }
        .message.user .message-bubble {
            background: #007aff;
            color: #fff;
        }
        .message.assistant .message-bubble {
            background: #fff;
            color: #333;
            border: 1px solid #e0e0e0;
        }
        .input-area {
            background: #fff;
            border-top: 1px solid #e0e0e0;
            padding: 16px 24px;
        }
        .input-form {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }
        .input-form input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 24px;
            font-size: 15px;
            outline: none;
        }
        .input-form input:focus {
            border-color: #007aff;
        }
        .input-form button {
            padding: 12px 24px;
            background: #007aff;
            color: #fff;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            cursor: pointer;
        }
        .input-form button:disabled {
            background: #999;
        }
        .rag-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #666;
            cursor: pointer;
            user-select: none;
        }
        .rag-toggle input {
            width: 16px;
            height: 16px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>AI 助手</h1>
        <span>用户：</span>
        <input type="text" id="userId" value="alice" placeholder="用户名">
    </div>

    <div class="chat-container" id="chatContainer"></div>

    <div class="input-area">
        <form class="input-form" id="chatForm">
            <input type="text" id="question" placeholder="输入你的问题..." autocomplete="off">
            <label class="rag-toggle">
                <input type="checkbox" id="ragToggle" checked>
                知识库
            </label>
            <button type="submit" id="sendBtn">发送</button>
        </form>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const chatForm = document.getElementById('chatForm');
        const questionInput = document.getElementById('question');
        const userIdInput = document.getElementById('userId');
        const sendBtn = document.getElementById('sendBtn');
        const ragToggle = document.getElementById('ragToggle');

        // 添加消息到页面
        // ⚠️ 安全要点：用 textContent 而不是 innerHTML
        // innerHTML 会把内容当 HTML 解析，如果大模型回答里包含 <script> 或 <img> 会触发 XSS
        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `<div class="message-bubble"></div>`;
            div.querySelector('.message-bubble').textContent = content;  // textContent = 纯文本，安全
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 加载历史记录
        async function loadHistory() {
            const userId = userIdInput.value;
            const resp = await fetch(`/history/${userId}`, {
                headers: { 'X-API-Key': 'my-secret-key-123456' }
            });
            const data = await resp.json();
            chatContainer.innerHTML = '';
            data.history.forEach(msg => {
                addMessage(msg.role, msg.content);
            });
        }

        // 发送消息（流式模式）
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const question = questionInput.value.trim();
            if (!question) return;

            addMessage('user', question);
            questionInput.value = '';
            sendBtn.disabled = true;

            // 先加一个空的 assistant 气泡，后面逐字往里填
            const assistantDiv = document.createElement('div');
            assistantDiv.className = 'message assistant';
            assistantDiv.innerHTML = '<div class="message-bubble"></div>';
            chatContainer.appendChild(assistantDiv);
            const bubble = assistantDiv.querySelector('.message-bubble');

            try {
                // 根据开关选择接口：知识库问答 / 普通对话
                const apiPath = ragToggle.checked ? '/rag/chat' : '/chat/stream';

                const resp = await fetch(apiPath, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': 'my-secret-key-123456'
                    },
                    body: JSON.stringify({
                        user_id: userIdInput.value,
                        question: question,
                        use_rag: ragToggle.checked
                    })
                });

                // 逐块读取流式响应
                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let answer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    answer += chunk;
                    bubble.textContent = answer;  // 逐字更新气泡
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            } catch (err) {
                bubble.textContent = '出错了，请稍后再试';
            } finally {
                sendBtn.disabled = false;
            }
        });

        // 切换用户时重新加载历史
        userIdInput.addEventListener('change', loadHistory);

        // 页面加载时先加载历史
        loadHistory();
    </script>
</body>
</html>
